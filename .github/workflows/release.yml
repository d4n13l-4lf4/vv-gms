# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    name: Build on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set OS name without '-latest'
        id: osname
        shell: bash
        run: |
          OS="${{ matrix.os }}"
          if [[ "$OS" == "ubuntu-latest" ]]; then
            OS_BASE="ubuntu"
          elif [[ "$OS" == "macos-latest" ]]; then
            OS_BASE="macos"
          elif [[ "$OS" == "macos-15-intel" ]]; then
            OS_BASE="macos-intel"
          elif [[ "$OS" == "windows-latest" ]]; then
            OS_BASE="windows"
          fi
          echo "os_base=$OS_BASE" >> $GITHUB_OUTPUT

      - name: Install Hatch
        uses: pypa/hatch@install

      - name: Create build environment
        run: hatch env create build

      - name: Build executable
        run: hatch run build:package -- ${{ vars.DEPLOY_MODE }} --name gms-${{ steps.osname.outputs.os_base }}

      - name: Zip executable
        if: vars.DEPLOY_MODE == '--onedir'
        run: |
          cd dist
          zip -r ../gms-${{ steps.osname.outputs.os_base }}.zip gms-${{ steps.osname.outputs.os_base }}

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        if: vars.DEPLOY_MODE == '--onefile'
        with:
            name: gms-${{ steps.osname.outputs.os_base }}${{ steps.osname.outputs.os_base == 'windows' && '.exe' || '' }}
            path: |
              dist/gms-${{ steps.osname.outputs.os_base }}${{ steps.osname.outputs.os_base == 'windows' && '.exe' || '' }}

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        if: vars.DEPLOY_MODE == '--onedir'
        with:
          name: gms-${{ steps.osname.outputs.os_base }}.zip
          path: |
            gms-${{ steps.osname.outputs.os_base }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            ./dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}