[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vv-gms"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Daniel Aucatoma", email = "d4n13l.4lf4@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/d4n13l-4lf4/vv-gms#readme"
Issues = "https://github.com/d4n13l-4lf4/vv-gms/issues"
Source = "https://github.com/d4n13l-4lf4/vv-gms"

[tool.hatch.version]
path = "src/vv_gms/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/vv_gms tests}"

[tool.coverage.run]
source_pkgs = ["vv_gms", "tests"]
branch = true
parallel = true
omit = [
  "src/vv_gms/__about__.py",
]

[tool.coverage.paths]
vv_gms = ["src/vv_gms", "*/vv-gms/src/vv_gms"]
tests = ["tests", "*/vv-gms/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
